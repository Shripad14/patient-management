// Specifies which version of Protocol Buffers syntax we are using.
// proto3 is the modern version commonly used with gRPC.

syntax = "proto3";

// ============================================================
// JAVA CODE GENERATION OPTIONS
// ============================================================

// Generate each message/service-related Java class as a
// separate Java file instead of putting everything inside
// one outer Java class.
//
// For example:
//   BillingRequest.java
//   BillingResponse.java
//   BillingServiceGrpc.java

option java_multiple_files = true;


// Package in which the generated Java classes will be placed.
//
// For example, generated classes will belong to:
//   org.pm.billingservice.grpc
//
// This is similar to:
//   package org.pm.billingservice.grpc;
// in a normal Java file.

option java_package = "billing";

// ============================================================
// gRPC SERVICE DEFINITION
// ============================================================

// 'service' defines a gRPC service.
//
// Think of this somewhat like defining a Java interface.
// It tells other services what operations they can call
// remotely on this service.
//
// BillingService = name of our gRPC service.

service BillingService{

  // 'rpc' means Remote Procedure Call.
  //
  // This defines a method that another service can call
    // remotely.
  //
  // CreateBilling = name of the RPC method.
  //
  // BillingRequest = type of data the client sends.
  //
  // BillingResponse = type of data the server returns.
  //
  // Conceptually similar to:
  //
  // BillingResponse createBilling(BillingRequest request);
  //
  // But this method is called over the network using gRPC.

  rpc CreateBillingService (BillingRequest)
      returns (BillingResponse);
}

// ============================================================
// REQUEST MESSAGE
// ============================================================

// 'message' defines a data structure.
//
// Think of it roughly like a Java DTO/class.
//
// This message represents the data that the client sends
// to the Billing Service when creating a billing record.

message BillingRequest {

  // 'string' = data type
  // 'patientId' = field name
  // '1' = field number/tag used by Protocol Buffers
  //
  // IMPORTANT:
  // The '= 1' is NOT the default value.
  // It is the unique field identifier used during
  // protobuf serialization.

  string patientId = 1;

  // Field number 2 identifies the 'name' field.
  string name = 2;

  // Field number 3 identifies the 'email' field.
  string email = 3;
}


// ============================================================
// RESPONSE MESSAGE
// ============================================================

// Defines the data structure that the Billing Service
// sends back to the client after processing the request.
message BillingResponse {

  // Account ID generated/returned by the Billing Service.
  //
  // '1' is the protobuf field number.
  string accountId = 1;

  // Status of the billing operation.
  //
  // Example:
  //   "CREATED"
  //   "FAILED"
  //   "ACTIVE"
  string status = 2;
}

//    BillingService
//            │
//            │
//    CreateBillingService()
//             │
//    ┌────────┴────────┐
//    ↓                 ↓
//    BillingRequest     BillingResponse
//    │                 │
//    ↓                 ↓
//    patientId             accountId
//    name                  status
//    email